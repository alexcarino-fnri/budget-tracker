{% extends 'base.html' %}

{% block title %}Delete Transaction - FinTrack{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow mb-4 border-left-danger">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-danger">Delete Transaction</h6>
                </div>
                <div class="card-body">
                    <p class="mb-4">Are you sure you want to delete this transaction? This action cannot be undone.</p>
                    <div class="alert alert-warning">
                        <strong>{{ object.description }}</strong> - ₱{{ object.amount }}
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'transaction_list' %}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-danger">Confirm Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
