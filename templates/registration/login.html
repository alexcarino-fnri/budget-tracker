<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .card-header {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1.5rem;
            border-radius: 1rem 1rem 0 0 !important;
            text-align: center;
        }
        .card-body {
            padding: 2rem;
        }
        .btn-primary {
            background-color: #10b981;
            border-color: #10b981;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #059669;
            border-color: #059669;
        }
        .form-control {
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0 fw-bold text-dark">FinTrack</h3>
                    <p class="text-muted mb-0 small">Sign in to manage your budget</p>
                </div>
                <div class="card-body">
                    {% if form.errors %}
                        <div class="alert alert-danger small">
                            Your username and password didn't match. Please try again.
                        </div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-medium">Username</label>
                            <input type="text" name="username" autofocus maxlength="150" required id="id_username" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label fw-medium">Password</label>
                            <input type="password" name="password" required id="id_password" class="form-control">
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold" style="color: #10b981;">Sign Up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
