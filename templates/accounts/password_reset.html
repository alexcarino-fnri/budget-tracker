{% extends 'base/base.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <a href="/" class="inline-block group">
            <img src="{% static 'icons/pisoflow-icon.svg' %}" alt="PisoFlow Icon" class="w-16 h-16 mx-auto rounded-3xl shadow-xl shadow-emerald-500/20 mb-3 object-contain group-hover:scale-105 transition transform" />
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Piso<span class="text-emerald-500">Flow</span></h1>
        </a>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Reset your password to regain access to your budget.</p>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl shadow-slate-950/5">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Email Address</label>
                <input type="email" name="email" id="id_email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="name@example.com">
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                <span>Send Instructions</span>
                <i data-lucide="mail" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
            <a href="{% url 'accounts:login' %}" class="text-sm font-semibold text-emerald-600 dark:text-emerald-400 hover:underline">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
