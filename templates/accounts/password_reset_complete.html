{% extends 'base/base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl shadow-slate-950/5 text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 mb-4">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Password Reset Successful</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Your password has been set. You can now proceed to log in with your new credentials.</p>
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center py-2.5 px-5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold shadow-md transition">Sign In Now</a>
    </div>
</div>
{% endblock %}
