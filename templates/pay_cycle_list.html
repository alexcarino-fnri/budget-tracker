{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Pay Cycles</h2>
        <a href="{% url 'pay_cycle_add' %}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add New Cycle
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="px-4 py-3">Cycle Name</th>
                            <th class="px-4 py-3">Starts on Day</th>
                            <th class="px-4 py-3 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cycle in pay_cycles %}
                        <tr>
                            <td class="px-4 py-3 fw-medium">{{ cycle.name }}</td>
                            <td class="px-4 py-3">{{ cycle.start_day }}th of the month</td>
                            <td class="px-4 py-3 text-end">
                                <a href="{% url 'pay_cycle_edit' cycle.pk %}" class="btn btn-sm btn-outline-secondary me-2">Edit</a>
                                <a href="{% url 'pay_cycle_delete' cycle.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center py-5 text-muted">
                                No pay cycles found. Create one to start tracking!
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
