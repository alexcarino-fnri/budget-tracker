{% extends 'base.html' %}

{% block title %}Categories - FinTrack{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0 text-gray-800">Categories</h1>
            <p class="text-muted mb-0">Organize your spending habits</p>
        </div>
        <a href="{% url 'category_add' %}" class="btn btn-primary shadow-sm">
            <i class="fas fa-plus fa-sm text-white-50"></i> Add New
        </a>
    </div>

    <!-- Categories Grid -->
    <div class="row">
        {% for category in categories %}
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2 stat-card">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                Category</div>
                            <div class="h5 mb-0 font-weight-bold text-gray-800">{{ category.name }}</div>
                        </div>
                        <div class="col-auto">
                            <i class="fas fa-tag fa-2x text-gray-300"></i>
                        </div>
                    </div>
                    <div class="mt-3 d-flex justify-content-end">
                        <a href="{% url 'category_edit' category.pk %}" class="btn btn-sm btn-light text-primary me-2" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a href="{% url 'category_delete' category.pk %}" class="btn btn-sm btn-light text-danger" title="Delete">
                            <i class="fas fa-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <div class="text-muted">
                <i class="fas fa-tags fa-3x mb-3 text-gray-300"></i>
                <p class="mb-0">No categories found. Start by adding one!</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
